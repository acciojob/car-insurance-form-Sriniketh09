<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<h1>SignUp Form</h1> <br/><br/>

	<form method='post'>
		<label for='label for='name'Name/label'>Name</label>
		<input type='text' id='name' placeholder='Name' required/> <br/> <br/>
		<label for='label for='email'Email/label'>Email</label>
		<input type='email' id='email' placeholder='Email' required/> <br> <br>
		<p>Gender</p>
		<input type='radio' id='gender_m' name='gender' required value='Male' /> <label for='gender_m'>Male</label>
		<input type='radio' id='gender_f' name='gender' required value='Female' /> <label for='gender_f'>Female</label> <br> <br>
		<label for='label for='cars'Cars/label'>--car brands--</label> <br>
		<select placeholder='--Please choose an option--' id='cars' multiple >
			<option value='BMW'>BMW</option>
			<option value='Audi'>Audi</option>
			<option value='Mercedez'>Mercedez</option>
		</select> <br><br>
		<label for='label for='carage'Carage/Label'>Car Age</label>
		<input type='number' id='carage' placeholder='Car Age' required> <br> <br>
		<label for='label for='dop'Dop/label'>Date of Purchase(dop)</label>
		<input type='date' id='dop' required/> <br><br>
		<label for='tel'>Phone Number</label>
		<input type='tel' id='tel' placeholder='xxx-xxx-xxxx' /> <br><br>
		<label for='label for='password'Password/label'>Password</label>
		<input type='password' id='password' placeholder='Password' required /> <br><br>
		
		<button type='submit'>Submit</button>
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
